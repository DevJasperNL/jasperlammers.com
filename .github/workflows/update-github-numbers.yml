# Refreshes the GitHub numbers on /record once a month and commits them to main; the push makes Workers Builds
# rebuild and deploy the site. The monthly commit is also repository activity, which keeps GitHub from
# disabling this schedule (it does so after 60 days without activity in a public repo).
name: Update GitHub numbers

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-github-numbers

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: node scripts/update-github-numbers.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/github-numbers.json
          git diff --cached --quiet && exit 0
          git commit -m "Update GitHub numbers ($(date -u +%Y-%m-%d))"
          git push
