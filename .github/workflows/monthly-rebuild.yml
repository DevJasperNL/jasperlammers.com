# Rebuilds the site once a month so the GitHub numbers on /record stay current.
# Needs the repository secret CF_DEPLOY_HOOK_URL: a Workers Builds deploy hook for the main branch
# (Cloudflare: Worker jasperlammers-com > Settings > Builds > Deploy Hooks).
name: Monthly rebuild

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Cloudflare deploy hook
        env:
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$CF_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret CF_DEPLOY_HOOK_URL is not set"
            exit 1
          fi
          curl --fail-with-body --silent --show-error -X POST "$CF_DEPLOY_HOOK_URL"
